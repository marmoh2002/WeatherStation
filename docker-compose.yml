x-common-env: &common-env
  KAFKA_BROKER: kafka:9092
  SCHEMA_REGISTRY_URL: http://schema-registry:8081

services:
  # kafka
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_BROKER_ID: 1
      KAFKA_ALLOW_PLAINTEXT_LISTENER: true
      KAFKA_TOPIC_AUTO_CREATE: true
      KAFKA_DELETE_TOPIC_ENABLE: true
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - KafkaNetwork

  # producer
  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer.minimal
    environment:
      <<: *common-env
      KAFKA_PRODUCER_TOPIC: weather-stations
    depends_on:
      schema-registry:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    networks:
      - KafkaNetwork
    restart: on-failure

  stream:
    build:
      context: .
      dockerfile: Dockerfile.stream.minimal
    environment:
      <<: *common-env
      KAFKA_WARNING_INPUT_TOPIC: weather-stations
      KAFKA_WARNING_OUTPUT_TOPIC: rain-alerts
      KAFKA_HUMIDITY_THRESHOLD: 70
    depends_on:
      producer:
        condition: service_started
      kafka-setup:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    networks:
      - KafkaNetwork
    restart: on-failure

  kafka-setup:
    image: apache/kafka:latest
    depends_on:
      - kafka
    networks:
      - KafkaNetwork
    entrypoint: [ "bash", "-c", "until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list; do echo 'Waiting for Kafka...'; sleep 2; done && echo 'Kafka is ready'" ]
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    depends_on:
      - kafka-setup
    environment:
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/subjects" ]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 5
    ports:
      - "8081:8081"
    networks:
      - KafkaNetwork
    restart: on-failure
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer.minimal
    environment:
      <<: *common-env
      KAFKA_CONSUMER_TOPIC: weather-stations
      PARQUET_OUTPUT_BASE_PATH: /app/parquet_output
      PARQUET_BATCH_SIZE: 100000
      PARQUET_FLUSH_INTERVAL_MINS: 60
      MAX_SEGMENT_SIZE_KB: 10000
      DISK_FLUSH_THRESHOLD: 10000
      HINT_FLUSH_THRESHOLD: 20
      BITCASK_STORE_DIRECTORY: /app/bitcask_data
      COMPACTION_INTERVAL_MINS: 3
    depends_on:
      producer:
        condition: service_started
      stream:
        condition: service_started
      kafka-setup:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    networks:
      - KafkaNetwork
    volumes:
      - parquet-shared-storage:${PARQUET_OUTPUT_BASE_PATH}
      - bitcask-shared-storage:${BITCASK_STORE_DIRECTORY}
    restart: on-failure
  client:
    build:
      context: .
      dockerfile: DockerFile.bitcaskClient
    # depends_on:
    #   - consumer
    environment:
      # We tell the client to talk to the consumer container
      - API_URL=http://consumer:8080
    volumes:
      - ./client_output:/client/output
      # - ./bitcask_client.sh:/client/bitcask_client.sh
    working_dir: /client/output
    networks:
      - KafkaNetwork
  elastic-search:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - KafkaNetwork
    restart: on-failure
  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic-search:9200
    depends_on:
      elastic-search:
          condition: service_healthy
    networks:
      - KafkaNetwork
    restart: on-failure   
  parquet-indexer:
    build:
      context: .
      dockerfile: DockerFile.indexer
    depends_on:
      elastic-search:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_URL=http://elastic-search:9200
      - ELASTICSEARCH_INDEX=weather-status
      - PARQUET_OUTPUT_BASE_PATH=/app/parquet_output
      - INDEXER_POLL_INTERVAL_SEC=30
      - INDEXER_STATE_FILE=/app/state/indexed-files.txt
    volumes:
      - parquet-shared-storage:/app/parquet_output:ro
      - indexer-state-storage:/app/state
    networks:
      - KafkaNetwork
    restart: on-failure

networks:
  KafkaNetwork:
    driver: bridge

volumes:
  parquet-shared-storage:
  bitcask-shared-storage:
  csv-shared-storage:
  indexer-state-storage:
