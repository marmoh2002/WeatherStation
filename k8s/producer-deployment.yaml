apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      initContainers:
        - name: wait-for-schema-registry
          image: alpine:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              
              echo "Waiting for Schema Registry..."
              until wget -q --spider http://schema-registry:8081/subjects; do
                echo "Schema Registry not ready, retrying in 5s..."
                sleep 5
              done
              echo "Schema Registry is ready!"
      containers:
        - name: producer
          image: weather-producer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: KAFKA_BROKER
            - name: SCHEMA_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: SCHEMA_REGISTRY_URL
            - name: KAFKA_PRODUCER_TOPIC
              value: "weather-stations"
      restartPolicy: Always
